name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render backend health
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors --max-time 30 \
            "https://acm-codenite.onrender.com/api/health")"
          printf '%s' "$response" | jq --exit-status --raw-output \
            'select(.status == "ONLINE") | "Backend healthy: " + .service'
